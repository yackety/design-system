<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div class="hv-stage"><div class="chips">
  <button class="chip" aria-pressed="true">All devices <span class="badge">24</span></button>
  <button class="chip" aria-pressed="false"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/> <path d="M9 18h6"/> <path d="M10 22h4"/></svg>Lighting <span class="badge">9</span></button>
  <button class="chip" aria-pressed="false"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"/> <path d="M9 8V2"/> <path d="M15 8V2"/> <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>Plugs &amp; power <span class="badge">5</span></button>
  <button class="chip" aria-pressed="false"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/> <path d="M12 6h.01"/> <circle cx="12" cy="14" r="4"/> <path d="M12 14h.01"/></svg>Audio &amp; screens</button>
  <button class="chip" aria-pressed="false"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Safety</button>
</div></div>
<script>
document.querySelectorAll('.chip').forEach(function (c) { c.onclick = function () { c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true'); Halvo.motion.nudge(c); }; });
</script>
</body>
</html>

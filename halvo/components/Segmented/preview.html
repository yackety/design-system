<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented</title></head>
<body>
<div class="hv-stage hv-col">
  <div class="seg" data-seg><span class="seg__thumb"></span>
    <button aria-pressed="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Heat</button><button aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/> <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>Eco</button><button aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="2" x2="22" y1="12" y2="12"/> <line x1="12" x2="12" y1="2" y2="22"/> <path d="m20 16-4-4 4-4"/> <path d="m4 8 4 4-4 4"/> <path d="m16 4-4 4-4-4"/> <path d="m8 20 4-4 4 4"/></svg>Cool</button><button aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/> <path d="M20 3v4"/> <path d="M22 5h-4"/> <path d="M4 17v2"/> <path d="M5 18H3"/></svg>Auto</button>
  </div>
  <div class="seg seg--accent" data-seg><span class="seg__thumb"></span>
    <button aria-pressed="false">Day</button><button aria-pressed="true">Week</button><button aria-pressed="false">Month</button><button aria-pressed="false">Year</button>
  </div>
</div>
<script>
var M = Halvo.motion;
document.querySelectorAll('[data-seg]').forEach(function (s) {
  var th = s.querySelector('.seg__thumb');
  s.querySelectorAll('button').forEach(function (b) { b.onclick = function () { s.querySelector('[aria-pressed="true"]').setAttribute('aria-pressed', 'false'); b.setAttribute('aria-pressed', 'true'); M.pill(th, b, { radius: 10 }); }; });
  requestAnimationFrame(function () { M.pill(th, s.querySelector('[aria-pressed="true"]'), { radius: 10, animate: false }); });
});
</script>
</body>
</html>

<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Halvo cover</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); }
  .cover svg { position: absolute; inset: 0; }
  .b-accent { fill: var(--accent); }
  .b-warm { fill: var(--warm); }
  .b-cool { fill: var(--cool); }
  .b-sand { fill: var(--h1); }
  .cut { fill: none; stroke: var(--bg); stroke-width: 12px; stroke-linecap: round; }
  .knob { fill: var(--h1); }
  .r-xl { rx: var(--r-xl); }
  .r-lg { rx: var(--r-lg); }
  .text { position: absolute; left: 44px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .92; font-weight: 600; letter-spacing: -.04em; color: var(--ink); }
  .tag { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: accent 200×260 slab (r-xl), warm disc d128, cool 140×110 and sand 108×80 tiles (r-lg); all gaps = gap 12px
         arrangement: one tall teal slab bleeding off the top, satellites stepping down and off the right and bottom edges
         pattern: literal motif — the thermostat dial — three concentric quarter-arcs cut from the slab in bg, ending in a sand knob ("a dial you turn", README)
         scales: gap 12, r-lg 22, r-xl 28, arc pitch 40, stroke 12 -->
    <rect class="b-accent r-xl" x="628" y="-28" width="200" height="260"/>
    <circle class="b-warm" cx="552" cy="208" r="64"/>
    <rect class="b-cool r-lg" x="840" y="110" width="140" height="110"/>
    <rect class="b-sand r-lg" x="840" y="232" width="108" height="80"/>
    <path class="cut" d="M688 232 A 60 60 0 0 0 628 172"/>
    <path class="cut" d="M728 232 A 100 100 0 0 0 628 132"/>
    <path class="cut" d="M768 232 A 140 140 0 0 0 628 92"/>
    <circle class="knob" cx="727" cy="133" r="13"/>
  </svg>
  <div class="text">
    <h1 class="name">Halvo</h1>
    <p class="tag">The smart home, under glass.</p>
  </div>
</div>
<script>
  document.documentElement.style.background = 'var(--bg)';
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>PageHead</title></head>
<body>
<div class="hv-stage">
  <header class="phead">
    <div class="phead__text">
      <div class="phead__eyebrow">Larch House · Wednesday evening</div>
      <h1 id="t">Good evening, Amara</h1>
      <p>Heating holds 21.5° until 22:30, then eases to 17° for the night. The dishwasher finishes at 20:20, and the roof covered 74% of today.</p>
      <div class="hv-row" style="margin-top:12px;gap:6px" id="facts">
        <span class="pill pill--plain"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/> <circle cx="9" cy="7" r="4"/> <path d="M22 21v-2a4 4 0 0 0-3-3.87"/> <path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>2 of 3 home</span>
        <span class="pill pill--plain"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/> <path d="M9 18h6"/> <path d="M10 22h4"/></svg>9 devices on</span>
        <span class="pill pill--plain"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>1.48 kW now</span>
        <span class="pill pill--good">Every door locked</span>
      </div>
    </div>
    <div class="phead__actions"><div class="avstack"><span class="av" style="--h:var(--h1)">AL</span><span class="av" style="--h:var(--h2)">TO</span></div><button class="btn btn--sm btn--ghost" data-replay><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>Replay</button></div>
  </header>
</div>
<script>
var M = Halvo.motion;
function play() { M.splitText(document.getElementById('t')); M.slide(document.querySelectorAll('#facts > *'), { delay: .35 }); }
document.querySelector('[data-replay]').onclick = play; play();
</script>
</body>
</html>

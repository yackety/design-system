<!-- @dsCard group="Actions" height=100 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton</title></head>
<body>
<div class="hv-stage hv-row">
  <button class="ibtn" aria-label="Search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/> <path d="m21 21-4.3-4.3"/></svg></button>
  <button class="ibtn" aria-label="Switch theme" id="theme"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/> <path d="M12 2v2"/> <path d="M12 20v2"/> <path d="m4.93 4.93 1.41 1.41"/> <path d="m17.66 17.66 1.41 1.41"/> <path d="M2 12h2"/> <path d="M20 12h2"/> <path d="m6.34 17.66-1.41 1.41"/> <path d="m19.07 4.93-1.41 1.41"/></svg></button>
  <button class="ibtn" aria-label="Notifications" id="bell"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="ibtn__badge">3</span></button>
  <button class="ibtn ibtn--sm" aria-label="Edit"><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/> <path d="m15 5 4 4"/></svg></button>
  <button class="ibtn ibtn--flat" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button>
  <button class="ibtn ibtn--round" aria-label="Lower"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button class="ibtn ibtn--round" aria-label="Raise"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button>
  <span class="kbd">⌘</span><span class="kbd">K</span>
</div>
<script>
var M = Halvo.motion, root = document.documentElement;
document.getElementById('bell').onclick = function () { M.ring(this.querySelector('svg'), this.querySelector('.ibtn__badge')); };
document.getElementById('theme').onclick = function () { var b = this; M.themeSwap(b, function () { root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light'; }); };
document.querySelectorAll('.ibtn').forEach(function (b) { if (!b.id) b.onclick = function () { M.nudge(b); }; });
</script>
</body>
</html>

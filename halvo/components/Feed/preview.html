<!-- @dsCard group="Data" height=330 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Feed</title></head>
<body>
<div class="hv-stage"><section class="card">
  <div class="chead"><div class="chead__text"><h3>Activity</h3><p>Today</p></div><button class="btn btn--sm" id="add">Simulate event</button></div>
  <div class="feed" id="feed">
    <div class="feed__row"><span class="feed__ico tone--good"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/> <path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><div class="feed__text"><b>Front door locked</b><small>by Amara · 19:38</small></div></div>
    <div class="feed__row"><span class="feed__ico tone--accent"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/> <path d="M20 3v4"/> <path d="M22 5h-4"/> <path d="M4 17v2"/> <path d="M5 18H3"/></svg></span><div class="feed__text"><b>Evening scene ran</b><small>Automation · 19:30</small></div></div>
    <div class="feed__row"><span class="feed__ico tone--warn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h3a2 2 0 0 1 2 2v14"/> <path d="M2 20h3"/> <path d="M13 20h9"/> <path d="M10 12v.01"/> <path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg></span><div class="feed__text"><b>Back door left open 5 min</b><small>Kitchen · 18:52</small></div></div>
    <div class="feed__row"><span class="feed__ico tone--plain"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/> <circle cx="9" cy="7" r="4"/> <path d="M22 21v-2a4 4 0 0 0-3-3.87"/> <path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><div class="feed__text"><b>Theo arrived home</b><small>18:20</small></div></div>
  </div>
</section></div>
<script>
var M = Halvo.motion, feed = document.getElementById('feed');
M.slide(feed.children);
document.getElementById('add').onclick = function () {
  var r = document.createElement('div'); r.className = 'feed__row';
  r.innerHTML = '<span class="feed__ico tone--bad"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/> <path d="M12 9v4"/> <path d="M12 17h.01"/></svg></span><div class="feed__text"><b>Motion at the side gate</b><small>Camera · just now</small></div>';
  feed.insertBefore(r, feed.firstChild); if (feed.children.length > 5) feed.lastChild.remove();
  M.slide(r, { y: -12 }); M.pop(r.querySelector('.feed__ico'), { delay: .1 });
};
</script>
</body>
</html>

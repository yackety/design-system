<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="hv-stage hv-col">
  <div class="hv-row">
    <button class="btn btn--primary magnetic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg>New</button>
    <button class="btn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/> <path d="M9 18h6"/> <path d="M10 22h4"/></svg>All on</button>
    <button class="btn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>All off</button>
    <button class="btn btn--ghost">Cancel</button>
    <button class="btn btn--danger"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/> <line x1="10" x2="10" y1="11" y2="17"/> <line x1="14" x2="14" y1="11" y2="17"/></svg>Remove</button>
    <button class="btn" disabled>Disabled</button>
  </div>
  <div class="hv-row">
    <button class="btn btn--primary btn--lg">Add a device</button>
    <button class="btn btn--lg">Plan</button>
    <button class="btn btn--primary btn--sm"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg>Scene</button>
    <button class="btn btn--sm">Thermostat</button>
    <a class="linkbtn" href="#" onclick="return false">All rooms</a>
  </div>
</div>
<script>
var M = Halvo.motion; M.magnetic();
document.querySelectorAll('.btn').forEach(function (b) { b.addEventListener('click', function () { M.nudge(b); }); });
</script>
</body>
</html>

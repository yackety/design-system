<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kpi</title></head>
<body>
<div class="hv-stage">
  <div class="kpis">
    <div class="kpi" style="--k:var(--warm)"><div class="kpi__label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>Drawing now</div><div class="kpi__value"><span data-n="1478">1,478</span><small>W</small></div>
      <div class="kpi__foot"><span><span class="live"></span>live</span><svg class="spark" viewBox="0 0 88 28"><path class="spark__area" d="M0 24 L14 22 L28 23 L42 18 L56 19 L70 10 L88 8 L88 28 L0 28Z"/><path d="M0 24 L14 22 L28 23 L42 18 L56 19 L70 10 L88 8"/></svg></div></div>
    <div class="kpi" style="--k:var(--cool)"><div class="kpi__label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/> <polyline points="16 7 22 7 22 13"/></svg>Used today</div><div class="kpi__value"><span data-n="15.8" data-d="1">15.8</span><small>kWh</small></div>
      <div class="kpi__foot"><span class="delta delta--down">↑ 25%</span> vs yesterday<svg class="spark" viewBox="0 0 88 28"><path d="M0 22 L10 20 L18 12 L26 16 L36 14 L46 17 L56 9 L66 12 L76 7 L88 6"/></svg></div></div>
    <div class="kpi" style="--k:var(--s3)"><div class="kpi__label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/> <path d="M12 2v2"/> <path d="M12 20v2"/> <path d="m4.93 4.93 1.41 1.41"/> <path d="m17.66 17.66 1.41 1.41"/> <path d="M2 12h2"/> <path d="M20 12h2"/> <path d="m6.34 17.66-1.41 1.41"/> <path d="m19.07 4.93-1.41 1.41"/></svg>Solar today</div><div class="kpi__value"><span data-n="11.7" data-d="1">11.7</span><small>kWh</small></div>
      <div class="kpi__foot">Battery 64%<svg class="spark" viewBox="0 0 88 28"><path class="spark__area" d="M0 26 C 20 26, 30 4, 44 4 S 68 26, 88 26 L88 28 L0 28Z"/><path d="M0 26 C 20 26, 30 4, 44 4 S 68 26, 88 26"/></svg></div></div>
    <div class="kpi"><div class="kpi__label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>Humidity</div><div class="kpi__value"><span data-n="46">46</span><small>%</small></div>
      <div class="kpi__foot"><span class="delta delta--up">↓ 2%</span> Comfort band 40–55%</div></div>
  </div>
  <div style="margin-top:10px"><button class="btn btn--sm btn--ghost" data-replay><svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>Replay</button></div>
</div>
<script>
var M = Halvo.motion;
function play() {
  M.rise(document.querySelectorAll('.kpi'));
  document.querySelectorAll('[data-n]').forEach(function (el, i) { var d = +(el.dataset.d || 0); M.countTo(el, +el.dataset.n, function (v) { return v.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d }); }, { from: 0, delay: .15 + i * .06 }); });
  M.draw(document.querySelectorAll('.spark path:not(.spark__area)'), { delay: .3 });
}
document.querySelector('[data-replay]').onclick = play; play();
</script>
</body>
</html>
